name: M2 contest-grade paper layer

# Track B CI.
# - Fast tests run on every PR to the M2 branch using the deterministic
#   FakeProvider (no API key, no network, fully offline).
# - The heavy contest-grade benchmark runs only on manual dispatch
#   (workflow_dispatch) so PR queues stay fast and deterministic.
on:
  pull_request:
    branches: [m2-contest-grade-paper, main]
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Also run the heavy contest-grade benchmark"
        type: boolean
        default: false

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn matplotlib
      - name: Run fast fake-provider tests (no API key)
        run: |
          python -m pytest tests/test_m2_core.py tests/test_m2_fixtures.py -q

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn matplotlib reportlab
      - name: Run contest-grade benchmark (thresholds: >=8 fig, >=5 tab, >=12 eq, >=3 candidates, rubric >= 75)
        run: |
          python -m pytest tests/test_m2_benchmark.py -q
